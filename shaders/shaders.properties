# ========================================
# CONFIGURACION DEL RENDERIZADO
# ========================================

sun = true
moon = true

oldLighting = false

program.shadow.enabled=SHADOWS_ENABLED

shadowTerrain=true
shadowTranslucent=false

#ifdef SHADOW_ENTITIES
shadowEntities=true
#else
shadowEntities=false
#endif

#ifdef SHADOW_BLOCK_ENTITIES
shadowBlockEntities=true
#else
shadowBlockEntities=false
#endif

# ========================================
# MENU PRINCIPAL
# ========================================

screen = <profile> <empty> [SOL] [LUNA] [ILUMINACION] [SOMBRAS] [IMAGEN] [CIELO]
screen.columns = 2

# ========================================
# SOL
# ========================================

screen.SOL = SUN_SIZE SUN_ROTATION SUN_BRIGHTNESS <empty> [SUN_COLORS] [SUN_HALO]
screen.SOL.columns = 2

screen.SUN_COLORS = SUN_AUTO_COLOR <empty> [SUN_DAWN] [SUN_NOON] [SUN_DUSK] [SUN_FIXED]
screen.SUN_COLORS.columns = 2

screen.SUN_DAWN = SUN_DAWN_R SUN_DAWN_G SUN_DAWN_B
screen.SUN_DAWN.columns = 1

screen.SUN_NOON = SUN_NOON_R SUN_NOON_G SUN_NOON_B
screen.SUN_NOON.columns = 1

screen.SUN_DUSK = SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B
screen.SUN_DUSK.columns = 1

screen.SUN_FIXED = SUN_FIXED_R SUN_FIXED_G SUN_FIXED_B
screen.SUN_FIXED.columns = 1

screen.SUN_HALO = SUN_HALO_STRENGTH SUN_HALO_SIZE
screen.SUN_HALO.columns = 1

# ========================================
# LUNA
# ========================================

screen.LUNA = MOON_SIZE MOON_ROTATION MOON_BRIGHTNESS <empty> [MOON_COLORS] [MOON_HALO]
screen.LUNA.columns = 2

screen.MOON_COLORS = MOON_AUTO_COLOR <empty> [MOON_RISE] [MOON_NIGHT] [MOON_SET] [MOON_FIXED]
screen.MOON_COLORS.columns = 2

screen.MOON_RISE = MOON_RISE_R MOON_RISE_G MOON_RISE_B
screen.MOON_RISE.columns = 1

screen.MOON_NIGHT = MOON_NIGHT_R MOON_NIGHT_G MOON_NIGHT_B
screen.MOON_NIGHT.columns = 1

screen.MOON_SET = MOON_SET_R MOON_SET_G MOON_SET_B
screen.MOON_SET.columns = 1

screen.MOON_FIXED = MOON_FIXED_R MOON_FIXED_G MOON_FIXED_B
screen.MOON_FIXED.columns = 1

screen.MOON_HALO = MOON_HALO_STRENGTH MOON_HALO_SIZE
screen.MOON_HALO.columns = 1

# ========================================
# ILUMINACION
# ========================================

screen.ILUMINACION = SUN_LIGHT_INTENSITY MOON_LIGHT_INTENSITY [LIGHT_COLORS] [LIGHT_AMBIENT] [LIGHT_WEATHER] <empty>
screen.ILUMINACION.columns = 2

screen.LIGHT_COLORS = LIGHT_FOLLOW_CELESTIAL_COLOR LIGHT_COLOR_SATURATION [SUN_LIGHT_COLOR] [MOON_LIGHT_COLOR]
screen.LIGHT_COLORS.columns = 2

screen.SUN_LIGHT_COLOR = SUN_LIGHT_R SUN_LIGHT_G SUN_LIGHT_B
screen.SUN_LIGHT_COLOR.columns = 1

screen.MOON_LIGHT_COLOR = MOON_LIGHT_R MOON_LIGHT_G MOON_LIGHT_B
screen.MOON_LIGHT_COLOR.columns = 1

screen.LIGHT_AMBIENT = AMBIENT_DAY AMBIENT_NIGHT SKY_LIGHT_DAY SKY_LIGHT_NIGHT
screen.LIGHT_AMBIENT.columns = 1

screen.LIGHT_WEATHER = LIGHT_MOON_PHASE LIGHT_RAIN_DIMMING LIGHT_RAIN_REDUCTION
screen.LIGHT_WEATHER.columns = 1

# ========================================
# SOMBRAS
# ========================================

screen.SOMBRAS = SHADOWS_ENABLED <empty> [SHADOW_QUALITY] [SHADOW_APPEARANCE] [SHADOW_CASTERS] [SHADOW_ADVANCED]
screen.SOMBRAS.columns = 2

screen.SHADOW_QUALITY = shadowMapResolution shadowDistance
screen.SHADOW_QUALITY.columns = 1

screen.SHADOW_APPEARANCE = SHADOW_SOFTENING SHADOW_SOFTNESS SHADOW_STRENGTH SHADOW_INDIRECT_DARKENING
screen.SHADOW_APPEARANCE.columns = 1

screen.SHADOW_CASTERS = SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES
screen.SHADOW_CASTERS.columns = 1

screen.SHADOW_ADVANCED = SHADOW_BIAS
screen.SHADOW_ADVANCED.columns = 1

# ========================================
# DESLIZADORES
# Mantener la lista en una sola linea.
# ========================================

sliders = SUN_SIZE SUN_ROTATION MOON_SIZE MOON_ROTATION SUN_BRIGHTNESS MOON_BRIGHTNESS SUN_DAWN_R SUN_DAWN_G SUN_DAWN_B SUN_NOON_R SUN_NOON_G SUN_NOON_B SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B SUN_FIXED_R SUN_FIXED_G SUN_FIXED_B MOON_RISE_R MOON_RISE_G MOON_RISE_B MOON_NIGHT_R MOON_NIGHT_G MOON_NIGHT_B MOON_SET_R MOON_SET_G MOON_SET_B MOON_FIXED_R MOON_FIXED_G MOON_FIXED_B SUN_HALO_STRENGTH SUN_HALO_SIZE MOON_HALO_STRENGTH MOON_HALO_SIZE SUN_LIGHT_INTENSITY MOON_LIGHT_INTENSITY LIGHT_COLOR_SATURATION SUN_LIGHT_R SUN_LIGHT_G SUN_LIGHT_B MOON_LIGHT_R MOON_LIGHT_G MOON_LIGHT_B AMBIENT_DAY AMBIENT_NIGHT SKY_LIGHT_DAY SKY_LIGHT_NIGHT LIGHT_RAIN_REDUCTION shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_STRENGTH SHADOW_BIAS SHADOW_INDIRECT_DARKENING IMAGE_SATURATION IMAGE_CONTRAST IMAGE_WARMTH IMAGE_EXPOSURE IMAGE_BRIGHTNESS LENS_VIGNETTE_STRENGTH LENS_VIGNETTE_START LENS_GRAIN_STRENGTH LENS_CHROMATIC_STRENGTH LENS_SHARPENING_STRENGTH SKY_BRIGHTNESS SKY_HORIZON_HEIGHT SKY_GRADIENT_CURVE SKY_TWILIGHT_INTENSITY SKY_TWILIGHT_WIDTH SKY_DAY_TOP_R SKY_DAY_TOP_G SKY_DAY_TOP_B SKY_DAY_HORIZON_R SKY_DAY_HORIZON_G SKY_DAY_HORIZON_B SKY_NIGHT_TOP_R SKY_NIGHT_TOP_G SKY_NIGHT_TOP_B SKY_NIGHT_HORIZON_R SKY_NIGHT_HORIZON_G SKY_NIGHT_HORIZON_B SKY_DAWN_TOP_R SKY_DAWN_TOP_G SKY_DAWN_TOP_B SKY_DAWN_FRONT_R SKY_DAWN_FRONT_G SKY_DAWN_FRONT_B SKY_DAWN_BACK_R SKY_DAWN_BACK_G SKY_DAWN_BACK_B SKY_DUSK_TOP_R SKY_DUSK_TOP_G SKY_DUSK_TOP_B SKY_DUSK_FRONT_R SKY_DUSK_FRONT_G SKY_DUSK_FRONT_B SKY_DUSK_BACK_R SKY_DUSK_BACK_G SKY_DUSK_BACK_B

# ========================================
# PERFILES DE CALIDAD
# ========================================

profile.RENDIMIENTO = SHADOWS_ENABLED shadowMapResolution:1024 shadowDistance:32.0 !SHADOW_SOFTENING !SHADOW_ENTITIES !SHADOW_BLOCK_ENTITIES

profile.EQUILIBRADO = SHADOWS_ENABLED shadowMapResolution:2048 shadowDistance:48.0 SHADOW_SOFTENING SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES

profile.CALIDAD = SHADOWS_ENABLED shadowMapResolution:4096 shadowDistance:64.0 SHADOW_SOFTENING SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES

# ========================================
# IMAGEN
# ========================================

screen.IMAGEN = IMAGE_COLOR_CORRECTION <empty> IMAGE_SATURATION IMAGE_CONTRAST IMAGE_WARMTH <empty> IMAGE_EXPOSURE IMAGE_BRIGHTNESS [LENTE] <empty>
screen.IMAGEN.columns = 2

# ========================================
# EFECTOS DE LENTE
# ========================================

screen.LENTE = [LENS_VIGNETTE_MENU] [LENS_GRAIN_MENU] [LENS_CHROMATIC_MENU] [LENS_SHARPENING_MENU]
screen.LENTE.columns = 2

screen.LENS_VIGNETTE_MENU = LENS_VIGNETTE LENS_VIGNETTE_STRENGTH LENS_VIGNETTE_START
screen.LENS_VIGNETTE_MENU.columns = 1

screen.LENS_GRAIN_MENU = LENS_GRAIN LENS_GRAIN_STRENGTH
screen.LENS_GRAIN_MENU.columns = 1

screen.LENS_CHROMATIC_MENU = LENS_CHROMATIC LENS_CHROMATIC_STRENGTH
screen.LENS_CHROMATIC_MENU.columns = 1

screen.LENS_SHARPENING_MENU = LENS_SHARPENING LENS_SHARPENING_STRENGTH
screen.LENS_SHARPENING_MENU.columns = 1

# ========================================
# CIELO
# ========================================

screen.CIELO = SKY_CUSTOM SKY_BRIGHTNESS [SKY_DAY] [SKY_NIGHT] [SKY_DAWN] [SKY_DUSK] [SKY_GRADIENT] <empty>
screen.CIELO.columns = 2

screen.SKY_DAY = [SKY_DAY_TOP] [SKY_DAY_HORIZON]
screen.SKY_DAY.columns = 2

screen.SKY_NIGHT = [SKY_NIGHT_TOP] [SKY_NIGHT_HORIZON]
screen.SKY_NIGHT.columns = 2

screen.SKY_DAWN = [SKY_DAWN_TOP] [SKY_DAWN_FRONT] [SKY_DAWN_BACK] <empty>
screen.SKY_DAWN.columns = 2

screen.SKY_DUSK = [SKY_DUSK_TOP] [SKY_DUSK_FRONT] [SKY_DUSK_BACK] <empty>
screen.SKY_DUSK.columns = 2

screen.SKY_GRADIENT = SKY_HORIZON_HEIGHT SKY_GRADIENT_CURVE SKY_TWILIGHT_INTENSITY SKY_TWILIGHT_WIDTH
screen.SKY_GRADIENT.columns = 1

# COLORES RGB

screen.SKY_DAY_TOP = SKY_DAY_TOP_R SKY_DAY_TOP_G SKY_DAY_TOP_B
screen.SKY_DAY_TOP.columns = 1

screen.SKY_DAY_HORIZON = SKY_DAY_HORIZON_R SKY_DAY_HORIZON_G SKY_DAY_HORIZON_B
screen.SKY_DAY_HORIZON.columns = 1

screen.SKY_NIGHT_TOP = SKY_NIGHT_TOP_R SKY_NIGHT_TOP_G SKY_NIGHT_TOP_B
screen.SKY_NIGHT_TOP.columns = 1

screen.SKY_NIGHT_HORIZON = SKY_NIGHT_HORIZON_R SKY_NIGHT_HORIZON_G SKY_NIGHT_HORIZON_B
screen.SKY_NIGHT_HORIZON.columns = 1

screen.SKY_DAWN_TOP = SKY_DAWN_TOP_R SKY_DAWN_TOP_G SKY_DAWN_TOP_B
screen.SKY_DAWN_TOP.columns = 1

screen.SKY_DAWN_FRONT = SKY_DAWN_FRONT_R SKY_DAWN_FRONT_G SKY_DAWN_FRONT_B
screen.SKY_DAWN_FRONT.columns = 1

screen.SKY_DAWN_BACK = SKY_DAWN_BACK_R SKY_DAWN_BACK_G SKY_DAWN_BACK_B
screen.SKY_DAWN_BACK.columns = 1

screen.SKY_DUSK_TOP = SKY_DUSK_TOP_R SKY_DUSK_TOP_G SKY_DUSK_TOP_B
screen.SKY_DUSK_TOP.columns = 1

screen.SKY_DUSK_FRONT = SKY_DUSK_FRONT_R SKY_DUSK_FRONT_G SKY_DUSK_FRONT_B
screen.SKY_DUSK_FRONT.columns = 1

screen.SKY_DUSK_BACK = SKY_DUSK_BACK_R SKY_DUSK_BACK_G SKY_DUSK_BACK_B
