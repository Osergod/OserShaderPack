# ========================================
# ELEMENTOS CELESTES
# ========================================

sun = true
moon = true

# ========================================
# MENU PRINCIPAL
# ========================================

screen = [SOL] [LUNA] [ILUMINACION] [SOMBRAS]
screen.columns = 2

# ========================================
# SOL
# ========================================

screen.SOL = SUN_SIZE SUN_ROTATION SUN_AUTO_COLOR SUN_BRIGHTNESS [SUN_COLORS] [SUN_HALO]
screen.SOL.columns = 2

screen.SUN_COLORS = [SUN_DAWN] [SUN_NOON] [SUN_DUSK] [SUN_FIXED]

screen.SUN_DAWN = SUN_DAWN_R SUN_DAWN_G SUN_DAWN_B
screen.SUN_DAWN.columns = 1

screen.SUN_NOON = SUN_NOON_R SUN_NOON_G SUN_NOON_B
screen.SUN_NOON.columns = 1

screen.SUN_DUSK = SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B
screen.SUN_DUSK.columns = 1

screen.SUN_FIXED = SUN_FIXED_R SUN_FIXED_G SUN_FIXED_B
screen.SUN_FIXED.columns = 1

# ========================================
# LUNA
# ========================================

screen.LUNA = MOON_SIZE MOON_ROTATION MOON_AUTO_COLOR MOON_BRIGHTNESS [MOON_COLORS] [MOON_HALO]
screen.LUNA.columns = 2

screen.MOON_COLORS = [MOON_RISE] [MOON_NIGHT] [MOON_SET] [MOON_FIXED]

screen.MOON_RISE = MOON_RISE_R MOON_RISE_G MOON_RISE_B
screen.MOON_RISE.columns = 1

screen.MOON_NIGHT = MOON_NIGHT_R MOON_NIGHT_G MOON_NIGHT_B
screen.MOON_NIGHT.columns = 1

screen.MOON_SET = MOON_SET_R MOON_SET_G MOON_SET_B
screen.MOON_SET.columns = 1

screen.MOON_FIXED = MOON_FIXED_R MOON_FIXED_G MOON_FIXED_B
screen.MOON_FIXED.columns = 1

# ========================================
# DESLIZADORES
# Mantener esta lista en una sola linea.
# ========================================

sliders = SUN_SIZE SUN_ROTATION MOON_SIZE MOON_ROTATION SUN_BRIGHTNESS MOON_BRIGHTNESS SUN_DAWN_R SUN_DAWN_G SUN_DAWN_B SUN_NOON_R SUN_NOON_G SUN_NOON_B SUN_DUSK_R SUN_DUSK_G SUN_DUSK_B SUN_FIXED_R SUN_FIXED_G SUN_FIXED_B MOON_RISE_R MOON_RISE_G MOON_RISE_B MOON_NIGHT_R MOON_NIGHT_G MOON_NIGHT_B MOON_SET_R MOON_SET_G MOON_SET_B MOON_FIXED_R MOON_FIXED_G MOON_FIXED_B SUN_HALO_STRENGTH SUN_HALO_SIZE MOON_HALO_STRENGTH MOON_HALO_SIZE SUN_LIGHT_INTENSITY MOON_LIGHT_INTENSITY LIGHT_COLOR_SATURATION SUN_LIGHT_R SUN_LIGHT_G SUN_LIGHT_B MOON_LIGHT_R MOON_LIGHT_G MOON_LIGHT_B AMBIENT_DAY AMBIENT_NIGHT SKY_LIGHT_DAY SKY_LIGHT_NIGHT LIGHT_RAIN_REDUCTION shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_STRENGTH SHADOW_BIAS

# ========================================
# HALOS
# ========================================

screen.SUN_HALO = SUN_HALO_STRENGTH SUN_HALO_SIZE
screen.SUN_HALO.columns = 1

screen.MOON_HALO = MOON_HALO_STRENGTH MOON_HALO_SIZE
screen.MOON_HALO.columns = 1

# Evitar el sombreado direccional antiguo sobre nuestra iluminacion
oldLighting = false

# ========================================
# ILUMINACION
# ========================================

screen.ILUMINACION = SUN_LIGHT_INTENSITY MOON_LIGHT_INTENSITY [LIGHT_COLORS] [LIGHT_AMBIENT] [LIGHT_WEATHER]
screen.ILUMINACION.columns = 1

# COLORES DE LA ILUMINACION

screen.LIGHT_COLORS = LIGHT_FOLLOW_CELESTIAL_COLOR LIGHT_COLOR_SATURATION [SUN_LIGHT_COLOR] [MOON_LIGHT_COLOR]
screen.LIGHT_COLORS.columns = 1

screen.SUN_LIGHT_COLOR = SUN_LIGHT_R SUN_LIGHT_G SUN_LIGHT_B
screen.SUN_LIGHT_COLOR.columns = 1

screen.MOON_LIGHT_COLOR = MOON_LIGHT_R MOON_LIGHT_G MOON_LIGHT_B
screen.MOON_LIGHT_COLOR.columns = 1

# LUZ AMBIENTAL Y DEL CIELO

screen.LIGHT_AMBIENT = AMBIENT_DAY AMBIENT_NIGHT SKY_LIGHT_DAY SKY_LIGHT_NIGHT
screen.LIGHT_AMBIENT.columns = 1

# FASES LUNARES Y LLUVIA

screen.LIGHT_WEATHER = LIGHT_MOON_PHASE LIGHT_RAIN_DIMMING LIGHT_RAIN_REDUCTION
screen.LIGHT_WEATHER.columns = 1

# ========================================
# RENDERIZADO DEL MAPA DE SOMBRAS
# ========================================

program.shadow.enabled=SHADOWS_ENABLED

shadowTerrain=true

# Agua y cristal no proyectan sombras opacas.
shadowTranslucent=false

#ifdef SHADOW_ENTITIES
shadowEntities=true
#else
shadowEntities=false
#endif

#ifdef SHADOW_BLOCK_ENTITIES
shadowBlockEntities=true
#else
shadowBlockEntities=false
#endif

# ========================================
# MENU DE SOMBRAS
# ========================================

screen.SOMBRAS = SHADOWS_ENABLED shadowMapResolution shadowDistance SHADOW_SOFTENING SHADOW_SOFTNESS SHADOW_STRENGTH [SHADOW_CASTERS] [SHADOW_ADVANCED]
screen.SOMBRAS.columns = 2

screen.SHADOW_CASTERS = SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES
screen.SHADOW_CASTERS.columns = 1

screen.SHADOW_ADVANCED = SHADOW_BIAS
screen.SHADOW_ADVANCED.columns = 1